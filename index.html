<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ChronoPath</title>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background: #f0f2f5; }
    
    /* PANTALLA DE LOGIN */
    #login-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #f0f2f5; z-index: 5000;
        display: flex; justify-content: center; align-items: center;
    }
    .login-card {
        background: white; padding: 40px; border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 380px; text-align: center;
    }
    .login-card h2 { margin-top: 0; color: #333; }
    .login-input {
        width: 100%; padding: 12px; margin: 8px 0;
        border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;
        font-size: 1rem;
    }
    .login-btn {
        width: 100%; padding: 12px; background: #007bff; color: white;
        border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer;
        margin-top: 15px; transition: background 0.2s;
    }
    .login-btn:hover { background: #0056b3; }
    .auth-link { color: #007bff; cursor: pointer; font-size: 0.9rem; text-decoration: none; display: block; margin-top: 15px; }

    /* APP CONTAINER */
    #app-container { display: none; width: 100%; height: 100%; position: relative; }
    
    #map { height: 100%; width: 100%; z-index: 1; background: #aadaff; }

    /* PANEL LATERAL */
    #controls {
      position: absolute; top: 20px; left: 20px; width: 360px; max-height: 85vh;
      background: rgba(255, 255, 255, 0.98); padding: 0; 
      border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      z-index: 1000; display: flex; flex-direction: column;
      overflow: hidden; transition: all 0.3s ease;
    }

    .panel-header {
        padding: 15px; background: #f8f9fa; border-bottom: 1px solid #eee;
        cursor: pointer; display: flex; justify-content: center; align-items: center;
        user-select: none; position: relative;
    }
    .panel-header h1 { margin: 0; font-size: 1.2rem; color: #333; font-weight: 700; }
    .panel-toggle-icon { position: absolute; right: 15px; font-size: 0.8rem; color: #666; transition: transform 0.3s; }
    #controls.collapsed .panel-toggle-icon { transform: rotate(-90deg); }
    #controls.collapsed #panel-content { display: none; }
    #controls.collapsed { max-height: 60px; }

    #panel-content { padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

    /* HERRAMIENTAS SUPERIORES */
    #top-right-tools {
        position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 8px; transition: all 0.3s;
    }
    .btn-tool {
        background: rgba(255, 255, 255, 0.95); border: 1px solid #ccc; border-radius: 8px;
        padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: #444;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .btn-tool:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

    /* PESTAÑAS */
    .tabs-header { display: flex; gap: 5px; margin-bottom: 5px; }
    .tab-btn {
        flex: 1; padding: 10px 5px; border: none; background: #f0f2f5; 
        cursor: pointer; font-size: 0.85rem; font-weight: 600; border-radius: 6px;
        color: #555; transition: all 0.2s;
    }
    #btn-tab-add.active { background: #007bff; color: white; } 
    #btn-tab-stats.active { background: #ffc107; color: #333; } 
    #btn-tab-time.active { background: #2ecc71; color: white; } 
    
    .tab-content { display: none; animation: fadeIn 0.3s; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* INPUTS */
    .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    label { font-weight: 600; font-size: 0.85rem; color: #555; }
    input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.95rem; outline: none; }
    input:focus, select:focus { border-color: #007bff; }

    /* BOTONES COLORES */
    .btn-main-tab {
        width: 100%; padding: 12px; border: none; border-radius: 8px;
        font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 10px;
        text-transform: uppercase; transition: background 0.2s, transform 0.1s;
        display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .btn-main-tab:active { transform: scale(0.98); }
    
    .btn-blue { background-color: #007bff; color: white; }
    .btn-blue:hover { background-color: #0056b3; }
    .btn-yellow { background-color: #ffc107; color: #333; }
    .btn-yellow:hover { background-color: #e0a800; }
    .btn-green { background-color: #2ecc71; color: white; }
    .btn-green:hover { background-color: #27ae60; }
    
    .btn-primary { background-color: #007bff; color: white; width: auto; }
    .btn-action { background-color: #6c757d; color: white; font-weight: 600; font-size: 0.85rem; padding: 8px; width: auto;}
    .btn-danger-block { background-color: #dc3545; color: white; width: 100%; font-weight: bold; margin-top: 10px; padding: 12px; border-radius: 6px;}
    .btn-del { background: #ffdede; color: #d00; border:none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem;}
    
    /* Botón Eliminar en Timeline (PEQUEÑO Y DISCRETO) */
    .btn-timeline-del { 
        background: transparent; border: 1px solid #999; color: #888; 
        font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; 
        cursor: pointer; margin-top: 5px; text-transform: uppercase; font-weight: normal;
    }
    .btn-timeline-del:hover { color: #ff4444; border-color: #ff4444; opacity: 1; }

    /* OTROS */
    details { background: #f8f9fa; border-radius: 8px; border: 1px solid #eee; padding: 8px; margin-top: 8px; }
    summary { cursor: pointer; font-weight: 600; color: #444; outline: none; list-style: none; display: flex; justify-content: space-between; align-items: center;}
    summary::after { content: "▼"; font-size: 0.7em; color: #999; }
    details[open] summary::after { content: "▲"; }

    .scroll-list { max-height: 150px; overflow-y: auto; margin: 5px 0 0 0; padding: 0; list-style: none; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .stats-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; color: #333; }
    .stats-table td, .stats-table th { border-bottom: 1px solid #eee; padding: 8px 5px; text-align: left; }
    
    /* MODALES */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; flex-direction: column; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #1e1e1e; color: #eee; width: 100%; box-sizing: border-box; }
    .modal-body { flex: 1; overflow-y: auto; padding: 20px; width: 100%; box-sizing: border-box; }
    .chart-container { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; max-width: 800px; margin: 0 auto 20px auto; }

    /* TIMELINE */
    .timeline-wrapper { position: relative; max-width: 600px; margin: 0 auto; padding-left: 30px; padding-bottom: 80px; color: #fff; }
    .timeline-wrapper::before { content: ''; position: absolute; top: 15px; bottom: 0; left: 6px; width: 2px; background: #444; }
    .timeline-year-block { margin-bottom: 30px; }
    .timeline-year-label { font-size: 1.5rem; font-weight: bold; color: #777; margin-bottom: 15px; margin-left: -15px; }
    .timeline-event { position: relative; margin-bottom: 25px; padding-left: 25px; }
    .timeline-dot { position: absolute; left: -29px; top: 6px; width: 12px; height: 12px; background: #ffc107; border-radius: 50%; border: 2px solid #121212; z-index: 2; }
    .timeline-country { font-size: 1.2rem; font-weight: 600; color: #ffc107; display: flex; align-items: center; gap: 10px; }
    .timeline-flag { width: 24px; height: auto; border-radius: 2px; }
    .timeline-date { color: #bbb; font-size: 0.95rem; margin-top: 4px; }
    .visit-count-tag { font-size: 0.85rem; color: #aaa; font-weight: normal; margin-left: 5px; }

    #loader { display: none; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      #controls { width: 90%; left: 5%; top: 10px; border-radius: 16px; }
      #panel-content { padding: 15px; }
      #top-right-tools { position: fixed; top: auto; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; justify-content: space-around; padding: 10px; border-radius: 50px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); backdrop-filter: blur(5px); gap: 5px; }
      .btn-tool { border: none; box-shadow: none; background: transparent; flex-direction: column; font-size: 0.75rem; padding: 5px; gap: 2px; }
    }
  </style>
</head>
<body>

  <div id="login-screen">
      <div class="login-card">
          <h2 id="auth-title">Iniciar Sesión</h2>
          <input type="email" id="auth-email" class="login-input" placeholder="Email" required>
          <input type="password" id="auth-password" class="login-input" placeholder="Contraseña" required>

            <div class="chart-container"><h3>Ciudades por País</h3><div style="overflow-y:visible;"><table class="stats-table"><thead><tr><th>País</th><th style="text-align:right;">Nº Ciudades</th></tr></thead><tbody id="citiesTableBody"></tbody></table></div></div>
            <div class="chart-container"><h3>Resumen General</h3>

            </div>
        </div></div>
      </div>

      <div id="controls" data-html2canvas-ignore="true">

            <div id="tab-add" class="tab-content active">
                <div class="input-group"><label>País</label><input type="text" id="inputTripCountry" list="listCountries" placeholder="Selecciona país..."><datalist id="listCountries"></datalist></div>
                <div class="input-group" style="flex-direction:row;"><select id="inputTripMonth" style="flex:1;"><option value="1">Enero</option><option value="2">Febrero</option><option value="3">Marzo</option><option value="4">Abril</option><option value="5">Mayo</option><option value="6">Junio</option><option value="7">Julio</option><option value="8">Agosto</option><option value="9">Septiembre</option><option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option></select><input type="number" id="inputTripYear" value="2025" style="width:70px;"></div>

            <div id="tab-stats" class="tab-content"><button class="btn-main-tab btn-yellow" onclick="openStatsModal()">📊 Ver Estadísticas</button></div>

                <summary>📍 Gestionar Ubicaciones</summary>
                <div class="input-group" style="margin-top:10px;"><label>Añadir Ciudad</label><div style="display:flex; gap:5px;"><input type="text" id="inputCity" list="listCities" placeholder="Ej: París, Francia" oninput="debounceCitySearch()" style="flex:1;"><button class="btn-primary" onclick="addCity()">+</button></div><datalist id="listCities"></datalist><div id="loader"></div></div>
                <div style="border-top:1px solid #eee; padding-top:10px;"><label>Eliminar Ciudad</label><input type="text" id="searchManage" placeholder="Filtrar..." oninput="renderManageCities()" style="width:100%; box-sizing:border-box; margin-top:5px;"><ul id="manageCityList" class="scroll-list"></ul></div>
            </details>

            <details>
                <summary>⚙️ Opciones</summary>
                <div class="input-group" style="margin-top:10px;"><label>Tamaño Puntos: <span id="pointSizeLabel">5</span></label><input type="range" id="pointSizeSlider" min="2" max="15" value="5" oninput="updatePointSize(this.value)"></div>
                <div style="border-top:1px solid #eee; padding-top:10px; margin-top:10px;"><label style="color:#444; font-weight:bold; margin-bottom:5px; display:block;">Gestión Manual de Países</label><label style="font-size:0.8rem; margin-top:5px;">Añadir</label><div style="display:flex; gap:5px;"><input type="text" id="manualCountryInput" list="listCountries" placeholder="Añadir País..." style="flex:1;"><button class="btn-action" style="background:#28a745; width:auto;" onclick="manualAddCountry()">+</button></div><label style="font-size:0.8rem; margin-top:10px; display:block;">Eliminar</label><div style="display:flex; gap:5px;"><select id="manualDeleteSelect" style="flex:1;"><option>Eliminar País...</option></select><button class="btn-del" onclick="manualDeleteCountry()">🗑️</button></div></div>
                <div style="border-top:1px solid #eee; padding-top:10px; margin-top:10px;"><button class="btn-danger-block" onclick="factoryReset()">⚠ Reiniciar de Fábrica</button></div>
            </details>
        </div>
      </div>
      <div id="map"></div>
  </div>

  <script>
    // ===========================================================
    // 1. CONFIGURACIÓN DE SUPABASE (¡PON TUS CLAVES AQUÍ!)

    function norm(str) { return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }

    // --- LOGICA AUTH & DATOS ---

    function toggleAuthMode() {
        const t = document.getElementById('auth-title');
        const b = document.getElementById('auth-submit-btn');
        const l = document.querySelector('.auth-link');
        if(t.innerText.includes('Iniciar')) {
            t.innerText='Registrarse'; b.innerText='Crear Cuenta'; l.innerText='¿Ya tienes cuenta? Inicia Sesión';
            b.onclick=()=>handleAuthSubmit(false);
        } else {
            t.innerText='Iniciar Sesión'; b.innerText='Entrar'; l.innerText='¿No tienes cuenta? Regístrate';
            b.onclick=()=>handleAuthSubmit(true);
        }
    }

    async function handleAuthSubmit(isLogin) {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const btn = document.getElementById('auth-submit-btn');
        const oldText = btn.innerText;
        btn.innerText = "Cargando...";
        
        if(!email || !password) { alert("Faltan datos"); btn.innerText=oldText; return; }

        let res;
        if(isLogin) {
            res = await supabase.auth.signInWithPassword({email, password});
        } else {
            // Importante: emailRedirectTo es clave para evitar errores si la config de Supabase lo pide
            res = await supabase.auth.signUp({
                email, 
                password,
                options: { emailRedirectTo: window.location.href } 
            });
        }

        if(res.error) {
            alert(res.error.message);
            btn.innerText=oldText;
        } else {
            // Chequear si el registro requiere confirmación de email
            if (!isLogin && res.data.user && !res.data.session) {
                alert("✅ Registro exitoso.\n\nTe hemos enviado un correo de verificación.\nPor favor, revisa tu bandeja de entrada y haz clic en el enlace para activar tu cuenta.");
                btn.innerText = oldText;
            } else {
                loadAppState();
            }
        }
    }

    async function logoutUser() {
        await supabase.auth.signOut();
        location.reload();
    }

    async function loadAppState() {
        const user = (await supabase.auth.getUser()).data.user;
        if (!user) { document.getElementById('login-screen').style.display='flex'; return; }

        document.getElementById('login-screen').style.display='none';
        document.getElementById('app-container').style.display='block';
        if(map) map.invalidateSize();

        const { data, error } = await supabase.from('mapa_data').select('data').eq('user_id', user.id).single();
        
        if(data && data.data) {
            appState = data.data;
            // Validar estructura
            if(!appState.countries) appState.countries={};
            if(!appState.cities) appState.cities=[];
            if(!appState.trips) appState.trips=[];
            if(!appState.pointSize) appState.pointSize=5;
        }

        // Refresh UI
        document.getElementById('pointSizeSlider').value = appState.pointSize;
        document.getElementById('pointSizeLabel').innerText = appState.pointSize;
        if(geoJsonLayer) geoJsonLayer.setStyle(styleFeature);
        cityMarkers.forEach(m => map.removeLayer(m.marker));
        cityMarkers=[];
        restoreCities();
        renderManageCities();
        renderManualDeleteList();
        updateStats(); 
    }

    // Guardar en Nube
    async function saveToCloud() {
        const user = (await supabase.auth.getUser()).data.user;
        if (!user) return;
        
        const btn = document.querySelector('#top-right-tools button:nth-child(2)');
        const old = btn.innerHTML;
        btn.innerHTML = '<span>☁</span> <span>...</span>';

        const { error } = await supabase.from('mapa_data').upsert([{ user_id: user.id, data: appState }]);
        
        if(error) alert("Error al guardar en nube: " + error.message);
        else {
            setTimeout(() => btn.innerHTML = old, 1000);
        }
    }

    // MAPA
    document.getElementById('map').innerHTML = '';
    const map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([40, -3], 2);
    L.control.zoom({ position: 'topleft' }).addTo(map); 
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap, &copy; CARTO', subdomains: 'abcd', maxZoom: 19, crossOrigin: true }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 19, zIndex: 1000, crossOrigin: true }).addTo(map);

    fetch(GEOJSON_URL).then(res => res.json()).then(data => {
        data.features.forEach(f => {
            const i3 = f.properties.ISO_A3 || f.properties.ADM0_A3;
            const i2 = f.properties.ISO_A2;
            if(i3 && i2) iso3to2[i3] = i2.toLowerCase();
            if(i3 && f.properties.CONTINENT) countryContinents[i3] = f.properties.CONTINENT;
        });
        iso3to2['FRA']='fr'; iso3to2['NOR']='no';
        countryContinents['FRA']='Europe'; countryContinents['NOR']='Europe';

        populateCountryList(data);
        geoJsonLayer = L.geoJSON(data, { style: styleFeature, onEachFeature: (f, l) => l.bindTooltip(getSpanishName(f.properties.ISO_A2, f.properties.NAME), {sticky:true, direction:'center', className:'country-tooltip'}) }).addTo(map);
        document.getElementById('map-loading-overlay').style.display = 'none';
        
        supabase.auth.onAuthStateChange((ev, session) => {
            if(session) loadAppState();
            else document.getElementById('login-screen').style.display='flex';
        });

    }).catch(console.error);

    function togglePanel() { document.getElementById('controls').classList.toggle('collapsed'); }
    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(tabId==='tab-add') document.getElementById('btn-tab-add').classList.add('active');
        if(tabId==='tab-stats') document.getElementById('btn-tab-stats').classList.add('active');
        if(tabId==='tab-time') document.getElementById('btn-tab-time').classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function getSpanishName(iso, fb) { if(!iso||iso==="-99") return fb; try { return regionNames.of(iso); } catch(e){ return fb; } }
    function getSovereignId(f) { return f.properties.ADM0_A3 || f.properties.ISO_A3; }
    function styleFeature(f) {
        const id = getSovereignId(f);
        const c = appState.countries[id];
        return { fillColor: c || '#fff', weight: 1, opacity: 1, color: '#999', fillOpacity: c ? 0.7 : 0 };
    }

    function createCityMarker(c) {
        const m = L.circleMarker([c.lat, c.lng], { color: 'red', fillColor: '#f00', fillOpacity: 1, radius: appState.pointSize, weight: 1 }).addTo(map);
        m.bindTooltip(c.name, { direction: 'top', offset: [0, -5] });
        cityMarkers.push({ data: c, marker: m });
    }
    function restoreCities() { appState.cities.forEach(c => createCityMarker(c)); }

    let searchTimeout;
    function debounceCitySearch() {
      const q = document.getElementById('inputCity').value;
      if(q.length < 3) return;
      document.getElementById('loader').style.display = 'block';
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=10&accept-language=es&q=${encodeURIComponent(q)}`)
          .then(r => r.json()).then(data => {
             const l = document.getElementById('listCities'); l.innerHTML = '';
             data.forEach(i => {
                 if(['administrative','place','city','town'].includes(i.type) || i.class==='place') {
                     const opt = document.createElement('option');
                     let txt = i.name;
                     const c = i.address?.country || "";
                     const r = i.address?.state || i.address?.region || "";
                     if(r) txt+= `, ${r}`; if(c) txt+= `, ${c}`;
                     opt.value = txt;
                     opt.setAttribute('data-lat', i.lat); opt.setAttribute('data-lon', i.lon);
                     opt.setAttribute('data-c', c); opt.setAttribute('data-n', i.name);
                     l.appendChild(opt);
                 }
             });
          }).finally(() => document.getElementById('loader').style.display = 'none');
      }, 600);
    }

    function addCity() {
        const val = document.getElementById('inputCity').value;
        const list = document.getElementById('listCities');
        let sel;
        for(let o of list.options) if(norm(o.value) === norm(val)) sel = o;
        if(!sel) return; 
        const cData = {
            name: sel.getAttribute('data-n'), lat: parseFloat(sel.getAttribute('data-lat')),
            lng: parseFloat(sel.getAttribute('data-lon')), country: sel.getAttribute('data-c')
        };
        appState.cities.push(cData);
        appState.history.push({ type: 'city', index: appState.cities.length - 1 });
        createCityMarker(cData);
        updateStats(); renderManageCities();
        document.getElementById('inputCity').value = '';
    }

    function addFullTrip() {
        const val = document.getElementById('inputTripCountry').value;
        const list = document.getElementById('listCountries');
        let id = null, name = val;
        for(let o of list.options) if(norm(o.value) === norm(val)) { id = o.getAttribute('data-id'); name=o.value; break; }
        if(!id) return; 
        
        const m = parseInt(document.getElementById('inputTripMonth').value);
        const y = parseInt(document.getElementById('inputTripYear').value);
        const tripObj = { id, name, month:m, year:y, tripId: Date.now() };
        appState.trips.push(tripObj);
        
        let createdCountry = false;
        if(!appState.countries[id]) {
             const hue = Math.floor(Math.random()*300)+30;
             appState.countries[id] = `hsl(${hue}, 70%, 60%)`;
             geoJsonLayer.resetStyle();
             renderManualDeleteList();
             createdCountry = true;
        }
        appState.history.push({ type: 'trip', tripObj, createdCountry });
        updateStats();
        document.getElementById('inputTripCountry').value = '';
    }

    function openTimeline() { renderTimeline(); document.getElementById('timeline-modal').style.display = 'flex'; }
    
    function renderTimeline() {
        const c = document.getElementById('timeline-container'); c.innerHTML = '';
        if(appState.trips.length===0) { c.innerHTML='<div style="text-align:center;margin-top:50px;color:#777">Sin viajes.</div>'; return; }

        const displayTrips = [...appState.trips].sort((a, b) => {
            if (b.year !== a.year) return b.year - a.year; 
            if (b.month !== a.month) return b.month - a.month; 
            return a.tripId - b.tripId; 
        });
        const chronoTrips = [...appState.trips].sort((a, b) => {
            if (a.year !== b.year) return a.year - b.year;
            if (a.month !== b.month) return a.month - b.month;
            return a.tripId - b.tripId;
        });
        const visitCounts = {};
        chronoTrips.forEach(t => { visitCounts[t.id] = (visitCounts[t.id] || 0) + 1; t.visitOrder = visitCounts[t.id]; });

        let curY = null, blk = null;
        displayTrips.forEach(t => {
            if(t.year !== curY) {
                curY = t.year;
                blk = document.createElement('div'); blk.className='timeline-year-block';
                blk.innerHTML = `<div class="timeline-year-label">${curY}</div>`;
                c.appendChild(blk);
            }
            const ev = document.createElement('div'); ev.className='timeline-event';
            const flag = `https://flagcdn.com/24x18/${iso3to2[t.id]||'xx'}.png`;
            const countTxt = t.visitOrder > 1 ? `<span class="visit-count-tag">(${t.visitOrder}ª vez)</span>` : '';
            ev.innerHTML = `
               <div class="timeline-dot"></div>
               <div class="timeline-card">
                 <div class="timeline-country"><img src="${flag}" class="timeline-flag" crossorigin="anonymous"> ${t.name} ${countTxt}</div>
                 <div class="timeline-date">✈ ${monthNames[t.month-1]}, ${t.year}</div>
                 <div class="timeline-actions" data-html2canvas-ignore="true">
                   <button class="btn-timeline-del" onclick="delTrip(${t.tripId})">ELIMINAR</button>
                 </div>
               </div>`;
            blk.appendChild(ev);
        });
    }

    function delTrip(uid) {
        if(!confirm("¿Borrar?")) return;
        const i = appState.trips.findIndex(t => t.tripId === uid);
        if(i !== -1) {
            appState.trips.splice(i, 1);
            renderTimeline(); updateStats();
        }
    }

    async function exportTimelinePDF() {
        const el = document.getElementById('timeline-container');
        const imgs = el.querySelectorAll('img');
        await Promise.all(Array.from(imgs).map(async img => {
            try {
                const b = await (await fetch(img.src)).blob();
                return new Promise(r => { const fr=new FileReader(); fr.onloadend=()=>{img.src=fr.result;r()}; fr.readAsDataURL(b); });
            } catch(e){ return Promise.resolve(); }
        }));
        html2canvas(el, { backgroundColor: "#121212", scale: 2, useCORS: true }).then(cvs => {
            const imgData = cvs.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const w = 210, m = 15, imgW = w-(m*2), imgH = cvs.height*imgW/cvs.width, pdf = new jsPDF('p','mm',[w,imgH+(m*2)]);
            pdf.setFillColor(18,18,18); pdf.rect(0,0,w,imgH+(m*2),'F');
            pdf.addImage(imgData,'PNG',m,m,imgW,imgH);
            pdf.save('cronologia.pdf');
        });
    }

    function openStatsModal() { document.getElementById('stats-modal').style.display = 'flex'; renderCharts(); }
    
    function renderCharts() {
        const years = {}, conts = {}, cityCounts = {};
        appState.trips.forEach(t => years[t.year] = (years[t.year]||0)+1);
        Object.keys(appState.countries).forEach(id => {
            let cName = countryContinents[id] || "Desconocido";
            const trans = {"Europe":"Europa","Africa":"África","Asia":"Asia","North America":"N. América","South America":"S. América","Oceania":"Oceanía","Antarctica":"Antártida"};
            cName = trans[cName] || cName;
            conts[cName] = (conts[cName]||0)+1;
        });
        appState.cities.forEach(c => { cityCounts[c.country] = (cityCounts[c.country]||0)+1; });
        const sortedCountries = Object.entries(cityCounts).sort((a,b) => b[1] - a[1]);

        if(myChartYears) myChartYears.destroy();
        myChartYears = new Chart(document.getElementById('chartYears'), {
            type: 'bar',
            data: { labels: Object.keys(years).sort(), datasets: [{ label: 'Viajes', data: Object.keys(years).sort().map(y=>years[y]), backgroundColor:'#007bff' }] }
        });
        if(myChartContinents) myChartContinents.destroy();
        myChartContinents = new Chart(document.getElementById('chartContinents'), {
            type: 'pie',
            data: { labels: Object.keys(conts), datasets: [{ data: Object.values(conts), backgroundColor: ['#4bc0c0','#ff6384','#36a2eb','#ffce56','#9966ff','#ff9f40','#c9cbcf'] }] }
        });

        const tbody = document.getElementById('citiesTableBody');
        tbody.innerHTML = '';
        if(sortedCountries.length === 0) tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#777;">Sin ciudades</td></tr>';
        else sortedCountries.forEach(([country, count]) => {
            tbody.innerHTML += `<tr><td>${country}</td><td style="text-align:right;"><strong>${count}</strong></td></tr>`;
        });
        
        document.getElementById('stat-total-countries').innerText = Object.keys(appState.countries).length;
        document.getElementById('stat-total-cities').innerText = appState.cities.length;
        document.getElementById('stat-total-trips').innerText = appState.trips.length;
    }
    
    function exportStatsPDF() {
        const el = document.getElementById('stats-content'); el.scrollTop = 0;
        html2canvas(el, { backgroundColor: "#ffffff", scale: 2 }).then(cvs => {
            const imgData = cvs.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const w = 210, m = 15, imgW = w-(m*2), imgH = cvs.height*imgW/cvs.width, pdf = new jsPDF('p','mm',[w,imgH+(m*2)]);
            pdf.setFillColor(255,255,255); pdf.rect(0,0,w,imgH+(m*2),'F');
            pdf.addImage(imgData,'PNG',m,m,imgW,imgH);
            pdf.save('estadisticas.pdf');
        });
    }

    function renderManageCities() {
        const l = document.getElementById('manageCityList'); l.innerHTML = '';
        const f = document.getElementById('searchManage').value.toLowerCase();
        if(appState.cities.length===0) { l.innerHTML='<li style="text-align:center;color:#777">Sin ciudades</li>'; return; }
        appState.cities.forEach((c, i) => {
            if(norm(`${c.name}, ${c.country}`).includes(norm(f))) {
                const li = document.createElement('li'); li.className='list-item';
                li.innerHTML = `<span>${c.name} <small>(${c.country})</small></span> <button class="btn-del btn-xs" onclick="delCity(${i})">Borrar</button>`;
                l.appendChild(li);
            }
        });
    }
    function delCity(i) {
        map.removeLayer(cityMarkers[i].marker);
        appState.cities.splice(i, 1);
        cityMarkers.splice(i, 1);
        renderManageCities();
        updateStats();
    }
    function updatePointSize(val) {
        appState.pointSize = val;
        document.getElementById('pointSizeLabel').innerText = val;
        cityMarkers.forEach(obj => obj.marker.setRadius(val));
    }
    function renderManualDeleteList() {
        const sel = document.getElementById('manualDeleteSelect');
        sel.innerHTML = '<option value="">Selecciona país...</option>';
        Object.keys(appState.countries).forEach(id => {
            const name = countryNames[id] || id;
            const opt = document.createElement('option');
            opt.value = id; opt.innerText = name;
            sel.appendChild(opt);
        });
    }
    function manualAddCountry() {
        const val = document.getElementById('manualCountryInput').value;
        const list = document.getElementById('listCountries');
        let id = null;
        for(let o of list.options) if(norm(o.value)===norm(val)){ id=o.getAttribute('data-id'); break; }
        if(id) {
            if(!appState.countries[id]) {
                const hue = Math.floor(Math.random()*300)+30;
                appState.countries[id] = `hsl(${hue}, 70%, 60%)`;
                geoJsonLayer.resetStyle();
                appState.history.push({ type: 'country', id: id });
                renderManualDeleteList(); updateStats();
            }
        } else alert("País no encontrado.");
        document.getElementById('manualCountryInput').value='';
    }
    function manualDeleteCountry() {
        const id = document.getElementById('manualDeleteSelect').value;
        if(!id || !confirm("¿SEGURO?")) return;
        delete appState.countries[id];
        geoJsonLayer.resetStyle();
        appState.trips = appState.trips.filter(t => t.id !== id);
        const selText = document.getElementById('manualDeleteSelect').options[document.getElementById('manualDeleteSelect').selectedIndex].text;
        for(let i=appState.cities.length-1; i>=0; i--) {
             if(appState.cities[i].country && (appState.cities[i].country === selText || appState.cities[i].country.includes(selText))) {
                 map.removeLayer(cityMarkers[i].marker);
                 appState.cities.splice(i, 1);
                 cityMarkers.splice(i, 1);
             }
        }
        updateStats(); renderManageCities(); renderManualDeleteList();
    }
    function factoryReset() {
        if(!confirm("¡ATENCIÓN! ¿Borrar TODOS los datos?")) return;
        appState = { countries: {}, cities: [], trips: [], history: [], pointSize: 5 };
        geoJsonLayer.resetStyle();
        cityMarkers.forEach(m => map.removeLayer(m.marker));
        cityMarkers = [];
        document.getElementById('pointSizeSlider').value = 5;
        document.getElementById('pointSizeLabel').innerText = 5;
        updateStats(); renderManageCities(); renderManualDeleteList();
    }
    function populateCountryList(data) {
      const l = document.getElementById('listCountries');
      const feats = [];
      data.features.forEach(f => {
          const id = getSovereignId(f);
          const name = getSpanishName(f.properties.ISO_A2, f.properties.NAME);
          if(id && UN_MEMBERS.includes(id)) { countryNames[id] = name; feats.push({id, name}); }
      });
      if(countryNames['FRA']) countryNames['FRA']='Francia';
      feats.sort((a,b)=>a.name.localeCompare(b.name));
      const seen = new Set();
      feats.forEach(c => {
          if(!seen.has(c.id)){ const o=document.createElement('option'); o.value=c.name; o.setAttribute('data-id',c.id); l.appendChild(o); seen.add(c.id); }
      });
    }
    function updateStats() { if(document.getElementById('stats-modal').style.display==='flex') renderCharts(); }

    function undoAction() {
        const last = appState.history.pop();
        if(!last) return;
        
        if(last.type === 'city') {
             const m = cityMarkers.pop();
             if(m) map.removeLayer(m.marker);
             appState.cities.pop();
             renderManageCities();
        } else if(last.type === 'country') {
             delete appState.countries[last.id];
             geoJsonLayer.resetStyle();
             renderManualDeleteList();
        } else if(last.type === 'trip') {
            const idx = appState.trips.findIndex(t => t.tripId === last.tripObj.tripId);
            if (idx !== -1) appState.trips.splice(idx, 1);
            if(last.createdCountry) {
                delete appState.countries[last.tripObj.id];
                geoJsonLayer.resetStyle();
                renderManualDeleteList();
            }
            if(document.getElementById('timeline-modal').style.display === 'flex') renderTimeline();
        }
        updateStats();
    }

    function saveMap() {
        try {
            const json = JSON.stringify(appState, null, 2); 
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'travel_data_backup.json';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch(e) { alert("Error al exportar datos."); }
    }
    
    function exportMapImage() {
        const b = event.target; const txt = b.innerText; b.innerText="⏳";
        html2canvas(document.getElementById('map'), {useCORS:true, allowTaint:false}).then(c => {
            const l = document.createElement('a'); l.download='mapa.png'; l.href=c.toDataURL(); l.click(); b.innerText=txt;
        });
    }
  </script>
